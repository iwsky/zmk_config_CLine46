# Custom Studio Protocol を複数使う場合の推奨値
CONFIG_ZMK_SPLIT_RELAY_EVENT=y
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000
CONFIG_ZMK_SPLIT_BLE_CENTRAL_SPLIT_RUN_STACK_SIZE=768
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=6144
CONFIG_ZMK_STUDIO_RPC_RX_BUF_SIZE=384
CONFIG_ZMK_STUDIO_RPC_TX_BUF_SIZE=384
CONFIG_ZMK_STUDIO_RPC_CUSTOM_SUBSYSTEM_REQUEST_PAYLOAD_MAX_BYTES=256
CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=240
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=6144
CONFIG_ZMK_STUDIO_RPC_THREAD_STACK_SIZE=6000
CONFIG_ZMK_CUSTOM_SETTINGS_LARGE_VALUE_MAX_SIZE=256

#Mouse config ---------------------
CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y
CONFIG_PMW3610=y
#CONFIG_PMW3610_ALT=y
#CONFIG_PMW3610_ALT_RUN_DOWNSHIFT_TIME_MS=500
#CONFIG_PMW3610_ALT_REST1_SAMPLE_TIME_MS=20
#CONFIG_PMW3610_ALT_SMART_ALGORITHM=y

#Battery config -------------------
#CONFIG_ZMK_BATTERY_REPORTING=y
#CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
#CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=7200000

##for NiMH battery
CONFIG_ZMK_NON_LIPO_BATTERY_MANAGEMENT=y
CONFIG_ZMK_NON_LIPO_MAX_MV=1360
CONFIG_ZMK_NON_LIPO_MIN_MV=1020
CONFIG_ZMK_NON_LIPO_LOW_MV=1000 
#CONFIG_ZMK_NON_LIPO_ADV_SLEEP_TIMEOUT=60000
# 60 seconds

#Layer LED config -------------------
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_HIGH=30
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_CRITICAL=10
CONFIG_RGBLED_WIDGET_SHOW_LAYER_COLORS=n

#Bluetooth config -------------------
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=12
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12

# ZMK Studio（必須ベース）
CONFIG_ZMK_STUDIO=y
# CONFIG_ZMK_STUDIO_LOCKING=n
# 注意: CONFIG_ZMK_STUDIO_LOCKING=n を設定しないでください。
# Studio Locking は BLE 接続に必要なため、デフォルトの y を維持する必要があります。
# 詳細は「BLE 接続」セクションを参照。

# BLE 接続スロット（プロファイル + Peripheral + Studio）
CONFIG_BT_MAX_CONN=6
CONFIG_BT_MAX_PAIRED=6

# DYA Studio 用の設定（Central 側）
# BLE 管理
CONFIG_ZMK_BLE_MANAGEMENT=y
CONFIG_ZMK_BLE_MANAGEMENT_STUDIO_RPC=y

# バッテリー履歴
#CONFIG_ZMK_BATTERY_HISTORY=n
#CONFIG_ZMK_BATTERY_HISTORY_STUDIO_RPC=n
# デフォルトでは USB 給電中はバッテリー履歴の記録がスキップされます。
# USB 接続中もバッテリー履歴を記録したい場合は n に設定してください。
#CONFIG_ZMK_BATTERY_SKIP_IF_USB_POWERED=n

# Settings RPC（アイドル/スリープ設定）
CONFIG_ZMK_SETTINGS_RPC=y
CONFIG_ZMK_SETTINGS_RPC_STUDIO=y

# Runtime Input Processor（トラックボール設定を DYA Studio から変更）
# トラックボール/ポインティングデバイスがある場合のみ必要
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR=y
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR_STUDIO_RPC=y

# ヒープメモリの拡張
CONFIG_HEAP_MEM_POOL_SIZE= 32768

# Bluetooth (Zephyr BLE stack) Memory / Buffer Tuning
CONFIG_BT_RX_STACK_SIZE=2560
CONFIG_BT_HCI_TX_STACK_SIZE=1024

# macro, combo
CONFIG_ZMK_RUNTIME_MACRO=y
CONFIG_ZMK_RUNTIME_MACRO_STUDIO_RPC=y
CONFIG_ZMK_BEHAVIOR_LOCAL_ID_TYPE_CRC16=y
CONFIG_ZMK_RUNTIME_COMBO=y
CONFIG_ZMK_RUNTIME_COMBO_STUDIO_RPC=y

#
CONFIG_ZMK_CUSTOM_SETTINGS=y
CONFIG_ZMK_CUSTOM_SETTINGS_SPLIT_RPC_RELAY=y
CONFIG_ZMK_CUSTOM_SETTINGS_STUDIO_RPC=y
CONFIG_ZMK_FAST_KEYMAP=y
CONFIG_ZMK_FAST_KEYMAP_STUDIO_RPC=y
CONFIG_ZMK_FAST_KEYMAP_DEFAULT_LAYER=y#

CONFIG_ZMK_WATCHDOG=y
CONFIG_ZMK_WATCHDOG_STUDIO_RPC=y

# Optional: flash slot cap (default 16). Once this many incidents are
# stored, recording stops until incidents are deleted (no ring-buffer
# overwrite -- see "Flash-wear protection" below).
CONFIG_ZMK_WATCHDOG_MAX_INCIDENTS=16

# Detectors -- default y once CONFIG_ZMK_WATCHDOG=y, only shown here for
# reference. Disable individually if you don't want a given detector.
CONFIG_ZMK_WATCHDOG_FREEZE_DETECT=y
CONFIG_ZMK_WATCHDOG_FREEZE_TIMEOUT_MS=5000
CONFIG_ZMK_WATCHDOG_FATAL_DETECT=y

# DEVTOOL
CONFIG_ZMK_DEVTOOL=y
CONFIG_ZMK_DEVTOOL_STUDIO_RPC=y
# Useful for USB serial Studio RPC during local testing.
CONFIG_ZMK_DEVTOOL_KEY_INJECTION=y
CONFIG_ZMK_DEVTOOL_EVENT_TAP=y
CONFIG_ZMK_DEVTOOL_LOG_CAPTURE=y
CONFIG_ZMK_DEVTOOL_STACK_USAGE=y

# trackball
CONFIG_ZMK_PMW3610_STUDIO_RPC=y
CONFIG_ZMK_PMW3610_CUSTOM_SETTINGS=y

# device info
CONFIG_ZMK_DEVICE_INFO=y
CONFIG_ZMK_DEVICE_INFO_STUDIO_RPC=y

# diag
CONFIG_ZMK_KSCAN_DIAGNOSTICS=y
CONFIG_ZMK_KSCAN_DIAGNOSTICS_STUDIO_RPC=y
# 分割キーボードの子機（Peripheral）側の診断応答を有効化
CONFIG_ZMK_KSCAN_DIAGNOSTICS_SPLIT=y
# 子機のマトリクス・トポロジー情報を送信するための中継バッファサイズ拡張（左右両方に必須）
CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=256

# Optional: enable zmk-feature-input-stream for live key-press
# visualization in the web UI (needs unlocking Studio to view).
CONFIG_ZMK_INPUT_STREAM_FEATURE=y
CONFIG_ZMK_INPUT_STREAM_FEATURE_STUDIO_RPC=y
